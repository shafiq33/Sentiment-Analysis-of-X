<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentiment Analysis of X</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 400px;
      margin: 0;
      width: 350px;
      padding: 10px;
      box-sizing: border-box;
      letter-spacing: -0.3px;
    }

    .container {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15), 0 0 1px rgba(0, 0, 0, 0.1);
      width: 100%;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #1da1f2;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    p {
      margin-bottom: 20px;
      color: #666;
      font-size: 0.95rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 15px;
      border-radius: 10px;
      border: 2px solid #e1e8ed;
      font-size: 1rem;
      margin-bottom: 15px;
      box-sizing: border-box;
      transition: border-color 0.3s ease;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #1da1f2;
    }

    input.valid {
      border-color: #17bf63;
    }

    input.invalid {
      border-color: #e0245e;
    }

    select {
      width: 100%;
      padding: 12px 15px;
      border-radius: 10px;
      border: 2px solid #e1e8ed;
      font-size: 1rem;
      margin-bottom: 15px;
      box-sizing: border-box;
      background: white;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #1da1f2 0%, #0d8adf 100%);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 20px;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(29, 161, 242, 0.3);
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }

    #results {
      text-align: left;
      max-height: 300px;
      overflow-y: auto;
      margin-top: 20px;
    }

    .summary {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      border-left: 4px solid #1da1f2;
    }

    .tweet {
      border-bottom: 1px solid #e1e8ed;
      padding: 12px 0;
      line-height: 1.5;
    }

    .tweet:last-child {
      border-bottom: none;
    }

    .sentiment {
      font-weight: bold;
      color: #1da1f2;
      margin-top: 5px;
    }

    .topic-btn {
      background: #1da1f2;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 8px 12px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.3s;
    }

    .topic-btn:hover {
      background: #0d8adf;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Sentiment Analysis of X</h1>
    <p>Search for keywords, hashtags, or user tags in X posts:</p>

    <input type="text" id="query" placeholder="e.g. #Bitcoin, Elon Musk, AI">
    <select id="search_mode">
      <option value="keyword">Keyword</option>
      <option value="trending">Trending Topics</option>
      <option value="user_tag">User Tag</option>
    </select>
    <button id="searchBtn">Analyze Sentiment</button>

    <div id="trendingContainer" style="display: none;">
      <div id="trendingTopics"></div>
      <button id="openWebpageBtn" style="margin-top: 10px; background: #666;">Open Full Webpage</button>
    </div>

    <div id="results"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
