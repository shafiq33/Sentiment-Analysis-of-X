<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentiment Analysis of X</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      letter-spacing: -0.3px;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15), 0 0 1px rgba(0, 0, 0, 0.1);
      width: 600px;
      text-align: center;
      backdrop-filter: blur(10px);
      animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #1da1f2;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    p {
      margin-bottom: 30px;
      color: #666;
      font-size: 1rem;
    }

    .tabs {
      display: flex;
      margin-bottom: 30px;
      border-bottom: 2px solid #e1e8ed;
    }

    .tab {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 500;
      color: #666;
      border-bottom: 2px solid transparent;
      transition: all 0.3s;
    }

    .tab.active {
      color: #1da1f2;
      border-bottom-color: #1da1f2;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    input[type="text"] {
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      border: 2px solid #e1e8ed;
      font-size: 1rem;
      margin-bottom: 20px;
      box-sizing: border-box;
      transition: border-color 0.3s ease;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #1da1f2;
    }

    input.valid {
      border-color: #17bf63;
    }

    input.invalid {
      border-color: #e0245e;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #1da1f2 0%, #0d8adf 100%);
      color: white;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 30px;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(29, 161, 242, 0.3);
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }

    .trending-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .topic-btn {
      background: #1da1f2;
      color: white;
      border: none;
      border-radius: 25px;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }

    .topic-btn:hover {
      background: #0d8adf;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(29, 161, 242, 0.3);
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
    }

    .pagination button {
      padding: 8px 12px;
      border: 1px solid #1da1f2;
      background: white;
      color: #1da1f2;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .pagination button:hover {
      background: #1da1f2;
      color: white;
    }

    .pagination button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #results {
      text-align: left;
      max-height: 400px;
      overflow-y: auto;
      margin-top: 30px;
    }

    .summary {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      border-left: 4px solid #1da1f2;
    }

    .tweet {
      border-bottom: 1px solid #e1e8ed;
      padding: 15px 0;
      line-height: 1.6;
    }

    .tweet:last-child {
      border-bottom: none;
    }

    .sentiment {
      font-weight: bold;
      color: #1da1f2;
      margin-top: 8px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Sentiment Analysis of X</h1>
    <p>Analyze sentiment from X (Twitter) posts using advanced AI</p>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('keyword')">Keyword Search</button>
      <button class="tab" onclick="switchTab('trending')">Trending Topics</button>
      <button class="tab" onclick="switchTab('user')">User Search</button>
    </div>

    <div id="keyword" class="tab-content active">
      <input type="text" id="query" placeholder="Enter keywords, hashtags, or topics">
      <button id="searchBtn" onclick="search('keyword')">Analyze Sentiment</button>
    </div>

    <div id="trending" class="tab-content">
      <div id="trendingTopics" class="trending-grid"></div>
      <div class="pagination">
        <button id="prevBtn" onclick="changePage(-1)" disabled>Previous</button>
        <span id="pageInfo">Page 1</span>
        <button id="nextBtn" onclick="changePage(1)">Next</button>
      </div>
    </div>

    <div id="user" class="tab-content">
      <input type="text" id="userQuery" placeholder="Enter @username">
      <button onclick="search('user_tag')">Analyze User Posts</button>
    </div>

    <div id="results"></div>
  </div>

  <script>
    let trendingTopics = [];
    let currentPage = 0;
    const topicsPerPage = 20;

    document.addEventListener('DOMContentLoaded', function() {
      loadTrendingTopics();
      setupValidation();
    });

    function switchTab(tabName) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

      event.target.classList.add('active');
      document.getElementById(tabName).classList.add('active');

      if (tabName === 'trending') {
        displayTrendingTopics();
      }
    }

    async function loadTrendingTopics() {
      try {
        const response = await fetch('/trending');
        const data = await response.json();
        trendingTopics = data.topics;
        displayTrendingTopics();
      } catch (error) {
        console.error('Failed to load trending topics:', error);
      }
    }

    function displayTrendingTopics() {
      const container = document.getElementById('trendingTopics');
      const start = currentPage * topicsPerPage;
      const end = start + topicsPerPage;
      const topics = trendingTopics.slice(start, end);

      container.innerHTML = topics.map(topic =>
        `<button class="topic-btn" onclick="searchTopic('${topic}')">${topic}</button>`
      ).join('');

      updatePagination();
    }

    function updatePagination() {
      const totalPages = Math.ceil(trendingTopics.length / topicsPerPage);
      document.getElementById('pageInfo').textContent = `Page ${currentPage + 1} of ${totalPages}`;
      document.getElementById('prevBtn').disabled = currentPage === 0;
      document.getElementById('nextBtn').disabled = currentPage >= totalPages - 1;
    }

    function changePage(delta) {
      currentPage += delta;
      displayTrendingTopics();
    }

    function setupValidation() {
      const queryInput = document.getElementById('query');
      const userInput = document.getElementById('userQuery');
      const searchBtn = document.getElementById('searchBtn');

      queryInput.addEventListener('input', () => validateInput(queryInput, 'keyword'));
      userInput.addEventListener('input', () => validateInput(userInput, 'user_tag'));
    }

    function validateInput(input, mode) {
      const value = input.value.trim();
      const isValid = mode === 'keyword' ? value.length > 0 : /^@[a-zA-Z0-9_]+$/.test(value);

      input.classList.toggle('valid', isValid);
      input.classList.toggle('invalid', !isValid && value.length > 0);
    }

    async function search(mode) {
      const query = mode === 'user_tag' ? document.getElementById('userQuery').value : document.getElementById('query').value;
      const resultsDiv = document.getElementById('results');

      if (!query.trim()) {
        resultsDiv.innerHTML = '<p>Please enter a search term.</p>';
        return;
      }

      resultsDiv.innerHTML = '<p>Loading...</p>';

      try {
        const response = await fetch('/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query, search_mode: mode })
        });

        const data = await response.json();
        displayResults(data);
      } catch (error) {
        resultsDiv.innerHTML = `<p>Error: ${error.message}</p>`;
      }
    }

    async function searchTopic(topic) {
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '<p>Loading...</p>';

      try {
        const response = await fetch('/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: topic, search_mode: 'trending' })
        });

        const data = await response.json();
        displayResults(data);
      } catch (error) {
        resultsDiv.innerHTML = `<p>Error: ${error.message}</p>`;
      }
    }

    function displayResults(data) {
      const resultsDiv = document.getElementById('results');

      if (data.message) {
        resultsDiv.innerHTML = `<p>${data.message}</p>`;
        return;
      }

      if (data.error) {
        resultsDiv.innerHTML = `<p>Error: ${data.error}</p>`;
        return;
      }

      const summary = data.summary || {};
      const tweets = data.tweets || data.sentiments || []; // Support both formats

      let html = `<div class="summary">
          <strong>Overall Sentiment:</strong> ${summary.overall}<br>
          Positive: ${summary.positive}, Negative: ${summary.negative}, Neutral: ${summary.neutral}
      </div>`;

      // Add chart container
      html += '<div style="margin: 20px 0; padding: 20px; background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(102,126,234,0.08);">';
      html += '<div style="font-size: 1.1rem; font-weight: 600; color: #14171a; margin-bottom: 15px; text-align: center;">Sentiment Distribution</div>';
      html += '<canvas id="sentimentChart" width="600" height="250"></canvas>';
      html += '</div>';

      html += '<h3>Analysis Results:</h3>';
      tweets.forEach(item => {
        const text = item.text;
        const sentiment = item.sentiment;
        html += `<div class="tweet">
            <p>${text}</p>
            <p class="sentiment">${sentiment}</p>
        </div>`;
      });

      resultsDiv.innerHTML = html;
      
      // Create the chart
      createSentimentChart(summary);
    }

    let sentimentChartInstance = null;

    function createSentimentChart(summary) {
      if (sentimentChartInstance) {
        sentimentChartInstance.destroy();
      }
      
      const ctx = document.getElementById('sentimentChart');
      if (!ctx) return;
      
      sentimentChartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['Positive', 'Neutral', 'Negative'],
          datasets: [{
            label: 'Number of Posts',
            data: [summary.positive, summary.neutral, summary.negative],
            backgroundColor: [
              'rgba(40, 167, 69, 0.8)',
              'rgba(255, 193, 7, 0.8)',
              'rgba(220, 53, 69, 0.8)'
            ],
            borderColor: [
              'rgba(40, 167, 69, 1)',
              'rgba(255, 193, 7, 1)',
              'rgba(220, 53, 69, 1)'
            ],
            borderWidth: 2,
            borderRadius: 8,
            borderSkipped: false
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          plugins: {
            legend: {
              display: false
            },
            tooltip: {
              backgroundColor: 'rgba(0, 0, 0, 0.8)',
              padding: 12,
              titleFont: { size: 14, weight: 'bold' },
              bodyFont: { size: 13 },
              borderColor: 'rgba(255, 255, 255, 0.2)',
              borderWidth: 1,
              displayColors: false,
              callbacks: {
                label: function(context) {
                  const total = summary.positive + summary.neutral + summary.negative;
                  const percentage = ((context.parsed.y / total) * 100).toFixed(1);
                  return context.parsed.y + ' posts (' + percentage + '%)';
                }
              }
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: { stepSize: 1, font: { size: 12 } },
              grid: { color: 'rgba(0, 0, 0, 0.05)' }
            },
            x: {
              ticks: { font: { size: 13, weight: '600' } },
              grid: { display: false }
            }
          }
        }
      });
    }
  </script>
</body>
</html>
